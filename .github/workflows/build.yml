name: build

# Build-and-pack only: tests run on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODULE_PATH: github.com/Masterminds/goutils
      MODULE_VERSION: v1.1.0
    steps:
      - uses: actions/checkout@v4

      # Modern Go is only used to run the module-zip helper; the library itself
      # is pre-modules (no go.mod) and stdlib-only.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Write module-zip helper (outside the checkout)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/modzip"
          cd "$RUNNER_TEMP/modzip"
          cat > create_mod.go <<'EOF'
          package main

          import (
                    "log"
                    "os"

                    "golang.org/x/mod/module"
                    "golang.org/x/mod/zip"
          )

          func main() {
                    if len(os.Args) != 5 {
                        log.Fatal("usage: go run create_mod.go <module-path> <version> <source-dir> <output-zip>")
                    }
                    m := module.Version{Path: os.Args[1], Version: os.Args[2]}
                    f, err := os.Create(os.Args[4])
                    if err != nil {
                        log.Fatal(err)
                    }
                    defer f.Close()
                    if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
                        log.Fatal(err)
                    }
                    log.Printf("created module zip: %s", os.Args[4])
          }
          EOF
          go mod init example.com/modzip
          go get golang.org/x/mod@v0.17.0

      # Zip a copy of the checkout with this authored workflow removed: it is
      # not part of the upstream module, and the zip must keep the public
      # proxy.golang.org member set. All other files ship as patched.
      - name: Create module zip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/build_output"
          cp -a "$GITHUB_WORKSPACE/." "$RUNNER_TEMP/src/"
          rm "$RUNNER_TEMP/src/.github/workflows/build.yml"
          cd "$RUNNER_TEMP/modzip"
          go run create_mod.go "$MODULE_PATH" "$MODULE_VERSION" \
            "$RUNNER_TEMP/src" "$RUNNER_TEMP/build_output/$MODULE_VERSION.zip"
          unzip -l "$RUNNER_TEMP/build_output/$MODULE_VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: goutils-v1.1.0-module-zip
          path: ${{ runner.temp }}/build_output/v1.1.0.zip
          if-no-files-found: error
